  <style>
    :root {
      --bg-blush: #FFE5E6;
      --ink: #1E1B2E;
      --p1: #FF5E6C;
      --p2: #20B2AA;
      --gold: #FFB703;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
      background-color: var(--bg-blush);
      background-image: radial-gradient(circle at 50% 35%, #FFF4F5 0%, #FFE5E6 60%, #FCD6D9 100%);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .steam-panel {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 50px -24px rgba(145, 72, 82, 0.24), 0 1px 3px rgba(145, 72, 82, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      backdrop-filter: blur(22px);
    }

    .steam-hero {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 245, 246, 0.72) 100%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 24px 60px -26px rgba(145, 72, 82, 0.25), inset 0 1px 0 rgba(255, 255, 255, 1);
      border-radius: 28px;
      backdrop-filter: blur(24px);
    }

    .steam-input {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(180, 130, 136, 0.28);
      color: #231924;
      box-shadow: inset 0 2px 5px rgba(145, 72, 82, 0.04);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .steam-input:focus {
      outline: none;
      background: #FFFFFF;
      border-color: #3A2438;
      box-shadow: 0 0 0 4px rgba(184, 59, 94, 0.1);
    }

    .steam-btn-gold {
      background: linear-gradient(135deg, #231924 0%, #3B2438 55%, #231924 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 16px 34px -12px rgba(35, 25, 36, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      color: #FFFBF7;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .steam-btn-gold:hover:not(:disabled) {
      transform: translateY(-1.5px);
      filter: brightness(1.08);
      box-shadow: 0 20px 40px -12px rgba(35, 25, 36, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
    .steam-btn-gold:active:not(:disabled) {
      transform: translateY(0.5px);
    }
    .steam-btn-gold:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      box-shadow: none;
    }

    .steam-btn-cyan {
      background: linear-gradient(135deg, #B83B5E 0%, #D96B78 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 14px 28px -10px rgba(184, 59, 94, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .steam-btn-cyan:hover:not(:disabled) {
      transform: translateY(-1.5px);
      filter: brightness(1.06);
      box-shadow: 0 18px 34px -10px rgba(184, 59, 94, 0.54);
    }
    .steam-btn-cyan:active:not(:disabled) {
      transform: translateY(0.5px);
    }

    .card-pop {
      background: #FFFFFF;
      border: 2px solid #1E1B2E;
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.65);
      border-radius: 20px;
      color: #1E1B2E;
    }

    .card-pop-sm {
      background: #FFFFFF;
      border: 2px solid #1E1B2E;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.45);
      border-radius: 14px;
      color: #1E1B2E;
    }

    .btn-pop {
      border: 2px solid #1E1B2E;
      box-shadow: 2px 2px 0px #1E1B2E;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
    }

    .btn-pop:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #1E1B2E;
    }

    .btn-pop:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #1E1B2E;
    }

    .btn-pop:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }

    .headband-float {
      animation: floatCard 3s ease-in-out infinite;
    }

    .headband-band {
      height: 10px;
      border-radius: 999px;
      border: 2px solid #1E1B2E;
    }

    .word-card-secret {
      background: repeating-linear-gradient(
        -45deg,
        #2D2847,
        #2D2847 10px,
        #39335A 10px,
        #39335A 20px
      );
      color: #FFD166;
    }

    .toast-enter {
      animation: toastSlide 0.25s ease forwards;
    }

    @keyframes bubblePop {
      0% { opacity: 0; transform: translateY(10px) scale(0.86); }
      65% { opacity: 1; transform: translateY(-2px) scale(1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .speech-bubble-pop {
      animation: bubblePop 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes modalBackdropFade {
      from { opacity: 0; backdrop-filter: blur(0px); }
      to { opacity: 1; backdrop-filter: blur(12px); }
    }
    @keyframes modalLuxuryEnter {
      0% { opacity: 0; transform: translateY(26px) scale(0.93); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
    }
    @keyframes luxuryStagger {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .modal-backdrop-anim {
      animation: modalBackdropFade 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .modal-luxury-card {
      animation: modalLuxuryEnter 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .luxury-stagger-1 {
      opacity: 0;
      animation: luxuryStagger 0.38s cubic-bezier(0.16, 1, 0.3, 1) 0.08s forwards;
    }
    .luxury-stagger-2 {
      opacity: 0;
      animation: luxuryStagger 0.38s cubic-bezier(0.16, 1, 0.3, 1) 0.16s forwards;
    }

    @keyframes toastSlide {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: rgba(30, 27, 46, 0.25);
      border-radius: 999px;
    }

    #three-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #three-stage canvas:active {
      cursor: grabbing;
    }
  </style>
</head>

            if (/국물|찌개|탕|국/.test(q)) return ['김치찌개','마라탕','라면','냉면','감자탕','순대국밥','부대찌개','칼국수'].includes(w) ? 'yes' : 'no';
            if (/매운|맵|빨간/.test(q)) return ['김치찌개','떡볶이','마라탕','라면','부대찌개','닭갈비'].includes(w) ? 'yes' : 'no';
            if (/달콤|단맛|디저트|간식|빵/.test(q)) return ['붕어빵','팥빙수','크루아상','호떡','와플','마카롱'].includes(w) ? 'yes' : 'no';
            if (/차가|시원/.test(q)) return ['냉면','팥빙수'].includes(w) ? 'yes' : 'no';
            if (/면|국수/.test(q)) return ['짜장면','라면','냉면','파스타','칼국수'].includes(w) ? 'yes' : 'no';
            if (/고기|육류|돼지|닭/.test(q)) return ['삼겹살','치킨','탕수육','감자탕','족발','햄버거','돈까스','닭갈비'].includes(w) ? 'yes' : 'no';
          }

          // Animal specifics
          if (catId === 'animal') {
            if (/물|바다|수영/.test(q)) return ['펭귄','돌고래','문어','수달','해파리','바다표범','하마'].includes(w) ? 'yes' : 'no';
            if (/날수|새|날개/.test(q)) return ['펭귄','부엉이','플라밍고','앵무새','공작새'].includes(w) ? 'yes' : 'no';
            if (/네발|다리4|다리네/.test(q)) return ['펭귄','부엉이','문어','플라밍고','앵무새','해파리','공작새'].includes(w) ? 'no' : 'yes';
            if (/귀여|반려|키울/.test(q)) return ['카피바라','판다','햄스터','수달','앵무새','사막여우','코알라','다람쥐','알파카'].includes(w) ? 'yes' : 'maybe';
          }

          // Media specifics
          if (catId === 'media') {
            if (/예능|프로그램/.test(q)) return ['런닝맨','무한도전','신서유기','나 혼자 산다','환승연애','지구오락실'].includes(w) ? 'yes' : 'no';
            if (/드라마/.test(q)) return ['오징어 게임','슬기로운 의사생활','더 글로리'].includes(w) ? 'yes' : 'no';
            if (/영화/.test(q)) return ['기생충','겨울왕국','어벤져스','해리포터','범죄도시','서울의 봄','인사이드 아웃','토이 스토리','타이타닉','센과 치히로의 행방불명','주토피아','알라딘','인터스텔라','극한직업','스즈메의 문단속'].includes(w) ? 'yes' : 'no';
          }

          // Direct keyword match inside word
          const cleanQ = q.replace(/[?까요이나가요]/g, '');
          if (cleanQ.length >= 2 && w.includes(cleanQ)) return 'yes';

          return 'maybe';
        },
        pickNextQuestion(catId) {
          const pool = AI_QUESTION_BANK[catId] || AI_QUESTION_BANK.custom;
          const asked = state.chatMessages.filter(m => m.senderIdx === 1).map(m => m.text);
          const unused = pool.filter(q => !asked.includes(q));
          if (unused.length > 0) {
            return unused[Math.floor(Math.random() * unused.length)];
          }
          // If AI asked all questions in bank, make a fun guess!
          const cat = CATEGORIES[catId] || getCurrentCategoryInfo();
          const candidates = (cat.words || []).filter(w => w !== state.players[0].word && !state.players[1].wrongGuesses.includes(w));
          if (candidates.length > 0 && Math.random() < 0.35) {
            return { isGuess: true, word: state.players[1].word }; // AI gets lucky occasionally
          }
          if (candidates.length > 0) {
            const pick = candidates[Math.floor(Math.random() * candidates.length)];
            return { isGuess: true, word: pick };
          }
          return '혹시 사람들이 아주 잘 아는 건가요?';
        },
        scheduleTurn(userQuestionText = null) {
          this.clear();
          if (state.playMode !== 'local' || state.screen !== 'play') return;

          // Step 1: AI answers the user's question
          if (state.turnPhase === 'answer' && getActiveActorIdx() === 1) {
            this.timerId = setTimeout(() => {
              if (state.screen !== 'play' || state.playMode !== 'local') return;
              const verdict = this.evaluateQuestion(state.players[0].word, state.selectedCategory, userQuestionText || '');
              const replyMap = {
                yes: ['응! 맞아 ㅎㅎ', '어 맞아, 그거야!', '응응 맞아요!'],
                no: ['아니, 그건 아니야!', '음 아니야 그건 아닌듯!', '아니오, 그건 아니에요!'],
                maybe: ['음... 그건 좀 애매한데?', '반반인 것 같아!', '애매해요! 다른 걸로 물어봐줘']
              };
              const pool = replyMap[verdict];
              const replyText = pool[Math.floor(Math.random() * pool.length)];

              state.chatMessages.push({
                id: Date.now() + Math.random(),
                senderIdx: 1,
                type: 'chat',
                roleTag: 'answer',
                text: replyText,
                time: getTimeStr()
              });
              Sound.chat();

              // Now it's AI's turn to ASK!
              state.askerIdx = 1;
              state.turnPhase = 'ask';
              state.turnCount += 1;
              renderPlayHUDAndChat();
              showSpeechBubble(state.players[1].name, replyText, 'answer');

              // Step 2: AI asks its own question after a short beat
              this.timerId = setTimeout(() => {
                if (state.screen !== 'play' || state.playMode !== 'local') return;
                const nextQ = this.pickNextQuestion(state.selectedCategory);
                if (typeof nextQ === 'object' && nextQ.isGuess) {
                  if (normalizeAnswer(nextQ.word) === normalizeAnswer(state.players[1].word)) {
                    state.chatMessages.push({
                      id: Date.now() + Math.random(),
                      senderIdx: 1,
                      type: 'chat',
                      roleTag: 'ask',
                      text: `🎯 저 정답 알겠어요! "${nextQ.word}" 맞죠?!`,
                      time: getTimeStr()
                    });
                    renderPlayHUDAndChat();
                    setTimeout(() => triggerVictory(1, false), 700);
                    return;
                  } else {
                    state.players[1].wrongGuesses.push(nextQ.word);
                    state.chatMessages.push({
                      id: Date.now() + Math.random(),
                      senderIdx: 1,
                      type: 'guess_wrong',
                      text: `🎯 AI 정답 도전: "${nextQ.word}" → 오답!`,
                      time: getTimeStr()
                    });
                    Sound.wrong();
                    state.askerIdx = 0;
                    state.turnPhase = 'ask';
                    state.turnCount += 1;
                    startTurnTimer();
                    renderPlayHUDAndChat();
                    return;
                  }
                }

                state.chatMessages.push({
                  id: Date.now() + Math.random(),
                  senderIdx: 1,
                  type: 'chat',
                  roleTag: 'ask',
                  text: nextQ,
                  time: getTimeStr()
                });
                Sound.chat();
                ThreeStage.triggerReaction('tilt');
                state.turnPhase = 'answer'; // Now it's USER's turn to answer AI!
                startTurnTimer();
                renderPlayHUDAndChat();
                showSpeechBubble(state.players[1].name, nextQ, 'ask');
              }, 1200);
            }, 950);
          }
        }
      };

      // ==========================================
      // 2. SOUND ENGINE (Web Audio API)
      // ==========================================
      const Sound = {
        ctx: null,
        muted: false,
        ensureCtx() {
          if (this.muted) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        },
        tone(freq, duration = 0.12, type = 'sine', vol = 0.12, delay = 0) {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime + delay;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(vol, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        },
        click() { this.tone(520, 0.07, 'triangle', 0.08); },
        chat() {
          this.tone(587.33, 0.08, 'sine', 0.1, 0);
          this.tone(783.99, 0.1, 'sine', 0.09, 0.05);
        },
        flip() {
          this.tone(392, 0.08, 'sine', 0.1, 0);
          this.tone(587, 0.12, 'sine', 0.1, 0.06);
        },
        wrong() {
          this.tone(220, 0.18, 'sawtooth', 0.1, 0);
          this.tone(185, 0.28, 'sawtooth', 0.1, 0.15);
        },
        win() {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, i) => this.tone(n, 0.22, 'triangle', 0.14, i * 0.09));
        },
        tick() {
          this.tone(880, 0.04, 'square', 0.03);
        }
      };

      // ==========================================
      // 2.5 CALM ORIGINAL BGM & WIND PARTICLES
      // ==========================================
      const BGM = {
        playing: false,
        userPaused: false,
        step: 0,
        timerId: null,
        // Gentle Fmaj7 -> G6 -> Em7 -> Am7 lo-fi music box progression
        chords: [
          [174.61, 220.00, 261.63, 329.63], // Fmaj7
          [196.00, 246.94, 293.66, 329.63], // G6
          [164.81, 196.00, 246.94, 293.66], // Em7
          [220.00, 261.63, 329.63, 392.00]  // Am7
        ],
        melody: [
          659.25, 0, 523.25, 587.33, 659.25, 0, 783.99, 659.25,
          587.33, 0, 493.88, 523.25, 587.33, 0, 659.25, 587.33,
          493.88, 0, 392.00, 440.00, 493.88, 0, 587.33, 493.88,
          523.25, 0, 659.25, 587.33, 523.25, 0, 440.00, 0
        ],
        playSoftNote(freq, dur, vol, type = 'sine', cutoff = 1200) {
          if (Sound.muted || !this.playing) return;
          const ctx = Sound.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(cutoff, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.05);
        },
        start(force = false) {
          if (Sound.muted) return;
          if (this.userPaused && !force) return;
          if (force) this.userPaused = false;
          const ctx = Sound.ensureCtx();
          if (!ctx) return;
          if (this.playing) return;
          this.playing = true;
          const tick = () => {
            if (!this.playing || Sound.muted) return;
            const mFreq = this.melody[this.step % this.melody.length];
            if (mFreq > 0) {
              this.playSoftNote(mFreq, 0.9, 0.032, 'sine', 1600);
            }
            if (this.step % 8 === 0) {
              const chord = this.chords[Math.floor(this.step / 8) % this.chords.length];
              chord.forEach(cf => this.playSoftNote(cf, 3.2, 0.015, 'triangle', 750));
            }
            this.step += 1;
          };
          tick();
          this.timerId = setInterval(tick, 460);
          this.updateButtons();
        },
        stop(byUser = false) {
          if (byUser) this.userPaused = true;
          this.playing = false;
          if (this.timerId) {
            clearInterval(this.timerId);
            this.timerId = null;
          }
          this.updateButtons();
        },
        toggle() {
          if (this.playing) this.stop(true);
          else this.start(true);
        },
        updateButtons() {
          const el = document.getElementById('btn-title-bgm');
          if (el) {
            el.innerHTML = this.playing && !Sound.muted
              ? '<span>🎵</span><span>잔잔한 노래 ON</span>'
              : '<span>🔇</span><span>잔잔한 노래 켜기</span>';
          }
        }
      };

      const WindFX = {
        rafId: null,
        resizeHandler: null,
        dispose() {
          if (this.rafId) {
            cancelAnimationFrame(this.rafId);
            this.rafId = null;
          }
          if (this.resizeHandler) {
            window.removeEventListener('resize', this.resizeHandler);
            this.resizeHandler = null;
          }
        },
        mount(canvas) {
          this.dispose();
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let w = 0;
          let h = 0;
          const resize = () => {
            w = canvas.width = canvas.parentElement ? canvas.parentElement.clientWidth : window.innerWidth;
            h = canvas.height = canvas.parentElement ? canvas.parentElement.clientHeight : window.innerHeight;
          };
          resize();
          this.resizeHandler = resize;
          window.addEventListener('resize', resize);

          const motes = Array.from({ length: 34 }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 1.5 + Math.random() * 3.5,
            vx: 0.4 + Math.random() * 0.9,
            vy: -0.25 + Math.random() * 0.5,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.25 + Math.random() * 0.45
          }));

          const ribbons = Array.from({ length: 6 }, (_, i) => ({
            y: (h / 7) * (i + 1),
            amp: 14 + i * 4,
            speed: 0.008 + i * 0.002,
            phase: i * 1.1,
            alpha: 0.16 + (i % 3) * 0.06
          }));

          let t = 0;
          const loop = () => {
            this.rafId = requestAnimationFrame(loop);
            t += 1;
            ctx.clearRect(0, 0, w, h);

            // Flowing gentle wind ribbons
            ribbons.forEach((rb, idx) => {
              ctx.beginPath();
              const baseY = (h / 7) * (idx + 1);
              for (let x = 0; x <= w; x += 28) {
                const y = baseY + Math.sin(x * 0.004 + t * rb.speed + rb.phase) * rb.amp;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = idx % 2 === 0
                ? `rgba(255, 255, 255, ${rb.alpha + 0.2})`
                : `rgba(244, 143, 155, ${rb.alpha})`;
              ctx.lineWidth = 2;
              ctx.stroke();
            });

            // Soft drifting petals / breeze motes
            motes.forEach(m => {
              m.x += m.vx + Math.sin(t * 0.02 + m.phase) * 0.35;
              m.y += m.vy + Math.cos(t * 0.015 + m.phase) * 0.25;
              if (m.x > w + 12) m.x = -12;
              if (m.y < -12) m.y = h + 12;
              if (m.y > h + 12) m.y = -12;
              ctx.beginPath();
              ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255, 255, 255, ${m.alpha})`;
              ctx.fill();
            });
          };
          loop();
        }
      };

      // ==========================================

      // ==========================================
      const state = {
        playMode: 'online', // 'online' | 'local'
        screen: 'title', // 'title' | 'setup' | 'lobby' | 'handoff' | 'play' | 'result'
        selectedCategory: 'food',

        timerSetting: 0,
        handoffEnabled: true,
        autoSwitchOnSend: true,
        players: [
          { id: 0, name: '나', avatar: '🐶', shirtColor: 0xFF5E6C, bandColor: 0xFF5E6C, word: '', score: 0, wrongGuesses: [] },
          { id: 1, name: 'AI 봇', avatar: '🤖', shirtColor: 0x20B2AA, bandColor: 0x20B2AA, word: '', score: 0, wrongGuesses: [] }

      // Check URL ?room=XXXX parameter for direct invite links
      try {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        if (urlRoom) {
          state.playMode = 'online';

      try {

      function savePrefs() {
        try {
          localStorage.setItem('yangsechan_prefs_v1', JSON.stringify({
            p1Name: state.players[0].name,
            p2Name: state.players[1].name,

      // ==========================================
      // 4. PEERJS 1:1 ONLINE ENGINE
      // ==========================================
      const PEER_PREFIX = 'ysc3d-room-';
      const Net = {
        peer: null,
        conn: null,

        cleanup() {
          if (this.conn) {
            try { this.conn.close(); } catch (_) {}
            this.conn = null;
          }
          if (this.peer) {
            try { this.peer.destroy(); } catch (_) {}
            this.peer = null;
          }
          state.online.role = null;
          state.online.roomCode = '';
          state.online.status = 'idle';
          state.online.statusMsg = '';
          state.online.peerConnected = false;
          state.online.waitingJudge = false;
        },

        generateCode() {
          const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
          let code = '';
          for (let i = 0; i < 4; i++) {
            code += chars[Math.floor(Math.random() * chars.length)];
          }
          return code;
        },

        send(payload) {
          if (this.conn && this.conn.open) {
            try {
              this.conn.send(payload);
              return true;
            } catch (_) {
              return false;
            }
          }
          return false;
        },

        createRoom() {
          if (typeof Peer === 'undefined') {
            showToast('PeerJS 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해주세요.', 'error');
            return;
          }
          this.cleanup();
          const code = this.generateCode();
          state.online.role = 'host';
          state.online.myIdx = 0;
          state.online.roomCode = code;
          state.online.status = 'creating';
          state.online.statusMsg = '온라인 방을 생성하는 중...';
          state.screen = 'lobby';
          savePrefs();
          render();

          try {
            const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
            this.peer = peer;

            peer.on('open', () => {
              state.online.status = 'waiting';
              state.online.statusMsg = '친구가 방 코드를 입력할 때까지 기다리는 중...';
              Sound.flip();
              render();
            });

            peer.on('connection', (conn) => {
              if (this.conn && this.conn.open) {
                conn.on('open', () => {
                  conn.send({ type: 'room_full' });
                  setTimeout(() => conn.close(), 200);
                });
                return;
              }
              this.attachConnection(conn);
            });

            peer.on('error', (err) => {
              state.online.status = 'error';
              if (err && err.type === 'unavailable-id') {
                state.online.statusMsg = '방 코드가 중복되었어요. 다시 방 만들기를 눌러주세요.';
              } else {
                state.online.statusMsg = '온라인 서버 연결에 실패했어요. (HTML 파일을 Netlify Drop 등에 올려 접속하거나 로컬 모드를 이용해보세요.)';
              }
              render();
            });
          } catch (_) {
            state.online.status = 'error';
            state.online.statusMsg = '온라인 연결을 초기화할 수 없어요.';
            render();
          }
        },

        joinRoom(rawCode) {
          if (typeof Peer === 'undefined') {
            showToast('PeerJS 라이브러리를 불러오지 못했어요.', 'error');
            return;
          }
          const code = String(rawCode || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
          if (code.length < 4) {
            showToast('4자리 방 코드를 입력해주세요!', 'warn');
            return;
          }
          this.cleanup();
          state.online.role = 'guest';
          state.online.myIdx = 1;
          state.online.roomCode = code;
          state.online.status = 'joining';
          state.online.statusMsg = `방 [${code}]에 연결하는 중...`;
          state.screen = 'lobby';
          savePrefs();
          render();

          try {
            const peer = new Peer({ debug: 0 });
            this.peer = peer;

            peer.on('open', () => {
              const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
              this.attachConnection(conn);
            });

            peer.on('error', (err) => {
              state.online.status = 'error';
              if (err && err.type === 'peer-unavailable') {
                state.online.statusMsg = `방 [${code}]을(를) 찾을 수 없어요. 방 코드를 다시 확인해주세요.`;
              } else {
                state.online.statusMsg = '연결에 실패했어요. 방장이 방을 열어두었는지 확인해주세요.';
              }
              render();
            });
          } catch (_) {
            state.online.status = 'error';
            state.online.statusMsg = '연결을 시작할 수 없어요.';
            render();
          }
        },

        attachConnection(conn) {
          this.conn = conn;
          conn.on('open', () => {
            state.online.peerConnected = true;
            state.online.status = 'connected';
            state.online.statusMsg = '친구와 실시간 1:1 연결 완료!';
            Sound.win();

            const me = state.players[state.online.myIdx];
            this.send({
              type: 'hello',
              name: me.name,
              avatar: me.avatar
            });
            render();
          });

          conn.on('data', (msg) => {
            this.handleMessage(msg);
          });

          conn.on('close', () => {
            state.online.peerConnected = false;
            showToast('친구와의 연결이 끊어졌어요.', 'error');
            if (state.screen === 'play' || state.screen === 'result') {
              renderPlayHUDAndChat();
            } else {
              state.online.status = 'error';
              state.online.statusMsg = '친구와의 연결이 종료되었어요.';
              render();
            }
          });
        },

        handleMessage(msg) {
          if (!msg || typeof msg !== 'object') return;
          const oppIdx = 1 - state.online.myIdx;

          if (msg.type === 'room_full') {
            state.online.status = 'error';
            state.online.statusMsg = '이미 2명이 접속 중인 방이에요.';
            render();
            return;
          }

          if (msg.type === 'hello') {
            state.players[oppIdx].name = msg.name || (oppIdx === 0 ? '방장' : '친구');
            state.players[oppIdx].avatar = msg.avatar || (oppIdx === 0 ? '🐶' : '🐱');
            showToast(`${state.players[oppIdx].name}님이 입장했어요!`, 'success');
            if (state.screen === 'lobby') render();
            return;
          }

          if (msg.type === 'word_setup_start') {
            state.roundNumber = msg.roundNumber;
            state.turnCount = 1;
            state.askerIdx = msg.firstTurn;
            state.turnPhase = 'ask';
            state.currentTurn = msg.firstTurn;
            state.timerSetting = msg.timerSetting || 0;
            state.online.categoryDisplay = msg.categoryDisplay;
            state.players[0].word = '';
            state.players[1].word = '';
            state.players[0].score = msg.scores[0];
            state.players[1].score = msg.scores[1];
            state.players[0].wrongGuesses = [];
            state.players[1].wrongGuesses = [];
            state.winner = null;
            state.chatDraft = '';
            state.chatMode = 'chat';
            state.online.waitingJudge = false;
            state.online.myWordSubmitted = false;
            state.online.oppWordSubmitted = false;
            state.online.wordDraft = '';
            state.screen = 'word_setup';
            Sound.flip();
            render();
            return;
          }

          if (msg.type === 'word_submitted') {
            if (msg.targetIdx === 0 || msg.targetIdx === 1) {
              state.players[msg.targetIdx].word = msg.word;
            }
            state.online.oppWordSubmitted = true;
            if (state.online.myWordSubmitted && state.online.oppWordSubmitted) {
              enterOnlinePlayAfterWords();
            } else {
              Sound.chat();
              showToast(`${state.players[oppIdx].name}님이 단어를 정했어요!`, 'success');
              if (state.screen === 'word_setup') render();
            }
            return;
          }

          if (msg.type === 'round_start') {
            state.roundNumber = msg.roundNumber;
            state.turnCount = 1;
            state.askerIdx = msg.firstTurn;
            state.turnPhase = 'ask';
            state.currentTurn = msg.firstTurn;
            state.timerSetting = msg.timerSetting || 0;
            state.online.categoryDisplay = msg.categoryDisplay;
            state.players[0].word = msg.words[0];
            state.players[1].word = msg.words[1];
            state.players[0].score = msg.scores[0];
            state.players[1].score = msg.scores[1];
            state.players[0].wrongGuesses = [];
            state.players[1].wrongGuesses = [];
            state.winner = null;
            state.chatDraft = '';
            state.chatMode = 'chat';
            state.online.waitingJudge = false;
            state.chatMessages = [
              {
                id: Date.now(),
                senderIdx: -1,
                type: 'system',
                text: `라운드 ${state.roundNumber} 시작! 주제 [${msg.categoryDisplay.emoji} ${msg.categoryDisplay.name}] · ${state.players[state.askerIdx].name}님부터 질문합니다!`,
                time: getTimeStr()
              }
            ];
            state.screen = 'play';
            Sound.flip();
            startTurnTimer();
            render();
            return;
          }

          if (msg.type === 'chat') {
            state.chatMessages.push({
              id: Date.now() + Math.random(),
              senderIdx: msg.senderIdx,
              type: 'chat',
              roleTag: msg.roleTag || 'ask',
              text: msg.text,
              time: msg.time || getTimeStr()
            });
            if (typeof msg.nextAskerIdx === 'number') state.askerIdx = msg.nextAskerIdx;
            if (msg.nextTurnPhase) state.turnPhase = msg.nextTurnPhase;
            if (typeof msg.turnCount === 'number') state.turnCount = msg.turnCount;
            state.chatMode = 'chat';
            Sound.chat();
            if (/^(예|응|맞아|네|ㅇㅇ|⭕)/.test(msg.text)) ThreeStage.triggerReaction('nod');
            else if (/^(아니|아냐|노|ㄴㄴ|땡|❌)/.test(msg.text)) ThreeStage.triggerReaction('shake');
            else if (msg.text.includes('?') || msg.text.includes('애매')) ThreeStage.triggerReaction('tilt');
            startTurnTimer();
            renderPlayHUDAndChat();
            if (msg.senderIdx !== state.online.myIdx) {
              showSpeechBubble(state.players[msg.senderIdx].name, msg.text, msg.roleTag || 'ask');
            }
            if (getActiveActorIdx() === state.online.myIdx) {
              showToast(state.turnPhase === 'answer' ? '💬 상대방 질문 도착! 대답할 차례예요.' : '🎤 이제 내 질문 차례예요!', 'dark');
            }
            return;
          }

          if (msg.type === 'judge_request') {
            const guesser = state.players[msg.guesserIdx];
            const me = state.players[state.online.myIdx];
            openJudgeModal(guesser, me, msg.guess, true);
            return;
          }

          if (msg.type === 'guess_wrong') {
            state.online.waitingJudge = false;
            const guesser = state.players[msg.guesserIdx];
            guesser.wrongGuesses.push(msg.guess);
            state.chatMessages.push({
              id: Date.now(),
              senderIdx: msg.guesserIdx,
              type: 'guess_wrong',
              text: `🎯 정답 도전: "${msg.guess}" → 오답!`,
              time: getTimeStr()
            });
            if (typeof msg.nextAskerIdx === 'number') state.askerIdx = msg.nextAskerIdx;
            state.turnPhase = 'ask';
            state.turnCount += 1;
            state.chatMode = 'chat';
            Sound.wrong();
            showToast(`땡! "${msg.guess}"은(는) 오답! ${state.players[state.askerIdx].name}님의 질문 차례!`, 'error');
            startTurnTimer();
            renderPlayHUDAndChat();
            return;
          }

          if (msg.type === 'win') {
            state.online.waitingJudge = false;
            triggerVictory(msg.winnerIdx, false);
          }
        }
      };

      // ==========================================
      // 5. 3D FIRST-PERSON STAGE (Three.js)

        createChalkboardTexture() {
          const canvas = document.createElement('canvas');
          canvas.width = 1600;

          const grad = ctx.createRadialGradient(800, 340, 80, 800, 380, 920);

          grad.addColorStop(1, '#143124');

            const sr = 40 + Math.random() * 110;

            smudge.addColorStop(0, 'rgba(255, 255, 255, 0.035)');

            ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);

          // Cute dashed chalk border inside chalkboard

          ctx.lineWidth = 4;
          ctx.setLineDash([14, 12]);
          ctx.strokeRect(36, 32, 1528, 696);

          // Top bunting / pennant garlands in pastel chalk colors

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';

          ctx.quadraticCurveTo(340, 145, 620, 48);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(980, 48);

            ctx.moveTo(-18, 0);
            ctx.lineTo(18, 0);
            ctx.lineTo(0, 34);
            ctx.closePath();
            ctx.fill();

          // Cute chalk smiley & heart on left

          const addBlush = (x, y, rx, ry, alpha) => {
            ctx.save();

            const g = ctx.createRadialGradient(0, 0, 0.1, 0, 0, 1);

            ctx.arc(0, 0, 1, 0, Math.PI * 2);

          addBlush(256, 286, 90, 42, 0.24);
          addBlush(205, 294, 52, 34, 0.28);

          freckles.forEach(([fx, fy, fr]) => {

        createEyeTexture() {

          // Centered iris on the front pole of the eye sphere

          irisGrad.addColorStop(0, '#A86228');
          irisGrad.addColorStop(0.55, '#6E3814');
          irisGrad.addColorStop(1, '#3A1A09');
          ctx.beginPath();
          ctx.arc(cx, cy, 42, 0, Math.PI * 2);
          ctx.fillStyle = irisGrad;
          ctx.fill();

          // Deep pupil
          ctx.beginPath();
          ctx.arc(cx, cy, 21, 0, Math.PI * 2);
          ctx.fillStyle = '#0D0908';

          // Dual bright Pixar specular catchlights
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(cx - 14, cy - 14, 9.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.beginPath();
          ctx.arc(cx + 12, cy + 12, 4.2, 0, Math.PI * 2);

          ].join('|');
          if (!force && sig === this.lastChalkSig) return;
          this.lastChalkSig = sig;
          if (this.chalkMat.map) this.chalkMat.map.dispose();
          this.chalkMat.map = this.createChalkboardTexture();
          this.chalkMat.needsUpdate = true;
        },

        triggerReaction(type) {
          this.reactionType = type;
          this.reactionEnd = performance.now() + 1100;
        }
      };

      // ==========================================
      // 6. HELPERS & GAME ACTIONS
      // ==========================================
      const appRoot = document.getElementById('app-root');
      const modalRoot = document.getElementById('modal-root');
      const toastContainer = document.getElementById('toast-container');
      const btnMute = document.getElementById('btn-mute');

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeAnswer(str) {
        return String(str || '').trim().toLowerCase().replace(/[\s\-_.,!?·]/g, '');
      }

      function copyToClipboard(text, successMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(successMsg, 'success'))
            .catch(() => fallbackCopy(text, successMsg));
        } else {
          fallbackCopy(text, successMsg);
        }
      }

      function fallbackCopy(text, successMsg) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(successMsg, 'success');
        } catch (_) {
          showToast('복사에 실패했어요. 직접 코드를 공유해주세요.', 'warn');
        }
      }

      let bubbleTimeout = null;

      let toastTimeout = null;
      function showToast(msg, tone = 'dark') {
        const colors = {
          dark: 'bg-[#1E1B2E] text-white',
          success: 'bg-emerald-600 text-white',
          warn: 'bg-amber-400 text-[#1E1B2E]',

        };
        toastContainer.innerHTML = `
          <div class="toast-enter px-4 py-2.5 rounded-2xl border-2 border-[#1E1B2E] shadow-[3px_3px_0px_#1E1B2E] font-bold text-sm ${colors[tone] || colors.dark}">
            ${escapeHtml(msg)}
          </div>
        `;
        clearTimeout(toastTimeout);

      function getCurrentCategoryInfo() {
        if (state.playMode === 'online' && state.online.role === 'guest') {
          return {
            id: 'remote',
            name: state.online.categoryDisplay.name,
            emoji: state.online.categoryDisplay.emoji,
            words: []
          };
        }
        if (state.selectedCategory === 'custom') {
          const words = state.customWordsText
            .split(/[\n,]+/)
            .map(w => w.trim())
            .filter(Boolean);
          const unique = [...new Set(words)];
          return {
            id: 'custom',
            name: state.customTopicName.trim() || '직접 만든 주제',
            emoji: '✏️',
            words: unique
          };
        }
        return CATEGORIES[state.selectedCategory];
      }

      function resolveActiveTopicKey() {
        if (state.playMode === 'online' && state.online.role === 'guest') {
          const name = state.online.categoryDisplay && state.online.categoryDisplay.name;
          const matched = Object.keys(CATEGORIES).find(k => CATEGORIES[k].name === name);
          return matched || 'custom';
        }
        return TOPIC_ASK_CHIPS[state.selectedCategory] ? state.selectedCategory : 'custom';
      }

      function getFreshAskChips(myIdx, forceShuffle = false) {
        const topicKey = resolveActiveTopicKey();
        const turnKey = `${state.roundNumber}|${state.turnCount}|${state.askerIdx}|${topicKey}`;
        const askedNorms = new Set(
          state.chatMessages
            .filter(m => m.senderIdx === myIdx && m.type === 'chat')
            .map(m => normalizeAnswer(m.text))
        );

        const basePool = TOPIC_ASK_CHIPS[topicKey] || TOPIC_ASK_CHIPS.custom;
        let unused = basePool.filter(c => !askedNorms.has(normalizeAnswer(c.text)));
        // Fallback to general custom pool if topic pool is completely exhausted
        if (unused.length < 3 && topicKey !== 'custom') {
          const extra = TOPIC_ASK_CHIPS.custom.filter(c => !askedNorms.has(normalizeAnswer(c.text)));
          unused = [...unused, ...extra];
        }

        if (!forceShuffle && state.askChipsTurnKey === turnKey && state.currentAskChips.length > 0) {
          // Keep current turn's chips (still filtering out anything just asked)
          const stillValid = state.currentAskChips.filter(c => !askedNorms.has(normalizeAnswer(c.text)));
          if (stillValid.length > 0) return stillValid;
        }

        // Fisher-Yates shuffle so every turn shows a fresh set of questions
        const shuffled = [...unused];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        state.askChipsTurnKey = turnKey;
        state.currentAskChips = shuffled.slice(0, 5);
        return state.currentAskChips;
      }

      function drawRandomWord(excludeList = []) {
        const cat = getCurrentCategoryInfo();
        let pool = cat.words.filter(w => !excludeList.includes(w) && !state.usedWords.includes(w));
        if (pool.length === 0) {
          state.usedWords = [];
          pool = cat.words.filter(w => !excludeList.includes(w));
        }
        if (pool.length === 0) pool = cat.words;
        const picked = pool[Math.floor(Math.random() * pool.length)];
        state.usedWords.push(picked);
        return picked;
      }

      function clearTurnTimer() {
        if (state.timerId) {
          clearInterval(state.timerId);
          state.timerId = null;
        }
      }

      function startTurnTimer() {
        clearTurnTimer();
        if (!state.timerSetting || state.screen !== 'play') return;
        state.timerRemaining = state.timerSetting;
        state.timerPaused = false;
        state.timerId = setInterval(() => {
          if (state.timerPaused || state.screen !== 'play') return;
          state.timerRemaining = Math.max(0, state.timerRemaining - 1);
          const timerEl = document.getElementById('live-timer-val');
          if (timerEl) {
            timerEl.textContent = `${state.timerRemaining}초`;
            if (state.timerRemaining <= 5 && state.timerRemaining > 0) {
              timerEl.classList.add('text-rose-600');
              Sound.tick();
            }
          }
          if (state.timerRemaining === 0) {
            clearTurnTimer();
            Sound.wrong();
            showToast('⏰ 시간 종료!', 'warn');
          }
        }, 1000);
      }

      function getTimeStr() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }

      function startNewRound(keepScores = true) {
        const cat = getCurrentCategoryInfo();
        if (cat.words.length < 2) {
          showToast('단어가 최소 2개 이상 필요해요! 단어를 추가해주세요.', 'error');
          return;
        }
        if (!keepScores) {
          state.players[0].score = 0;
          state.players[1].score = 0;
          state.roundNumber = 1;
          state.usedWords = [];
        } else {
          state.roundNumber += 1;
        }

        const w1 = drawRandomWord([]);
        const w2 = drawRandomWord([w1]);
        state.players[0].word = w1;
        state.players[1].word = w2;
        state.players[0].wrongGuesses = [];
        state.players[1].wrongGuesses = [];
        state.winner = null;
        state.turnCount = 1;
        state.askerIdx = (state.roundNumber - 1) % 2;
        state.turnPhase = 'ask';
        state.currentTurn = state.askerIdx;
        state.online.categoryDisplay = { name: cat.name, emoji: cat.emoji };
        state.online.waitingJudge = false;
        state.chatMessages = [
          {
            id: Date.now(),
            senderIdx: -1,
            type: 'system',
            text: `라운드 ${state.roundNumber} 시작! 주제 [${cat.emoji} ${cat.name}] · ${state.players[state.askerIdx].name}님부터 질문합니다!`,
            time: getTimeStr()
          }
        ];
        state.chatDraft = '';
        state.chatMode = 'chat';
        clearTurnTimer();
        savePrefs();
        Sound.flip();

        if (state.playMode === 'online') {
          state.players[0].word = '';
          state.players[1].word = '';
          state.online.myWordSubmitted = false;
          state.online.oppWordSubmitted = false;
          state.online.wordDraft = '';
          Net.send({
            type: 'word_setup_start',
            roundNumber: state.roundNumber,
            firstTurn: state.askerIdx,
            timerSetting: state.timerSetting,
            categoryDisplay: { name: cat.name, emoji: cat.emoji },
            scores: [state.players[0].score, state.players[1].score]
          });
          state.screen = 'word_setup';
          render();
          return;
        }

        AI.clear();
        state.players[1].name = state.players[1].name || 'AI 봇';
        state.askerIdx = 0;
        state.turnPhase = 'ask';
        state.currentTurn = 0;
        state.screen = 'play';
        startTurnTimer();
        render();
      }

      function enterOnlinePlayAfterWords() {
        const cat = getCurrentCategoryInfo();
        state.chatMessages = [
          {
            id: Date.now(),
            senderIdx: -1,
            type: 'system',
            text: `라운드 ${state.roundNumber} 시작! 서로 정해준 이마 위 단어를 보고 ${state.players[state.askerIdx].name}님부터 질문합니다!`,
            time: getTimeStr()
          }
        ];
        state.chatDraft = '';
        state.chatMode = 'chat';
        state.screen = 'play';
        Sound.flip();
        startTurnTimer();
        render();
      }

      function getActiveActorIdx() {
        return state.turnPhase === 'ask' ? state.askerIdx : (1 - state.askerIdx);
      }

      function isMyTurnToAct() {
        if (state.playMode === 'online') {
          return state.online.peerConnected && !state.online.waitingJudge && state.online.myIdx === getActiveActorIdx();
        }
        return getActiveActorIdx() === 0;
      }

      function switchPerspective(withHandoff = state.handoffEnabled, targetIdx = null) {
        if (state.playMode === 'online') return;
        state.currentTurn = targetIdx !== null ? targetIdx : getActiveActorIdx();
        state.chatDraft = '';
        state.chatMode = 'chat';
        if (withHandoff) {
          clearTurnTimer();
          AI.clear(); ThreeStage.dispose();
          state.screen = 'handoff';
          render();
        } else {
          ThreeStage.syncOpponent();
          startTurnTimer();
          renderPlayHUDAndChat();
        }
      }

      function triggerVictory(winnerIdx, broadcast = true) {
        clearTurnTimer();
        AI.clear(); ThreeStage.dispose();
        state.winner = winnerIdx;
        state.players[winnerIdx].score += 1;
        state.screen = 'result';
        if (state.playMode === 'online' && broadcast) {
          Net.send({ type: 'win', winnerIdx });
        }
        Sound.win();
        render();
        if (typeof confetti === 'function') {
          confetti({ particleCount: 90, spread: 75, origin: { y: 0.6 } });
          setTimeout(() => {
            confetti({ particleCount: 60, angle: 60, spread: 60, origin: { x: 0 } });
            confetti({ particleCount: 60, angle: 120, spread: 60, origin: { x: 1 } });
          }, 220);
        }
      }

      function handleChatSubmit() {
        if (!isMyTurnToAct()) {
          showToast('지금은 상대방 차례예요! 잠시 기다려주세요.', 'warn');
          return;
        }
        const raw = state.chatDraft.trim();
        if (!raw) return;

        const isOnline = state.playMode === 'online';
        const myIdx = isOnline ? state.online.myIdx : getActiveActorIdx();
        const curr = state.players[myIdx];
        const opp = state.players[1 - myIdx];

        const isExplicitGuess = state.turnPhase === 'ask' && (state.chatMode === 'guess' || raw.startsWith('!정답 ') || raw.startsWith('/정답 '));
        if (isExplicitGuess) {
          const guessText = raw.replace(/^(!정답|\/정답)\s*/, '').trim();
          if (!guessText) {
            showToast('정답으로 외칠 단어를 입력해주세요!', 'warn');
            return;
          }
          state.chatDraft = '';
          state.chatMode = 'chat';
          state.online.waitingJudge = true;
          renderPlayHUDAndChat();

          if (isOnline) {
            if (normalizeAnswer(guessText) === normalizeAnswer(curr.word)) {
              setTimeout(() => {
                state.online.waitingJudge = false;
                triggerVictory(curr.id, true);
              }, 600);
            } else {
              Net.send({ type: 'judge_request', guesserIdx: curr.id, guess: guessText });
              showToast(`"${guessText}" 도전! ${opp.name}님이 정답인지 확인 중...`, 'warn');
            }
          } else {
            // Solo AI mode: NEVER let user judge their own guess; AI checks it!
            showToast(`"${guessText}" 도전! ${opp.name}님이 정답인지 확인하고 있어요...`, 'warn');
            AI.clear();
            AI.timerId = setTimeout(() => {
              if (state.screen !== 'play' || state.playMode !== 'local') return;
              state.online.waitingJudge = false;
              if (normalizeAnswer(guessText) === normalizeAnswer(curr.word)) {
                state.chatMessages.push({
                  id: Date.now() + Math.random(),
                  senderIdx: 1,
                  type: 'chat',
                  roleTag: 'answer',
                  text: `🎉 정답이에요! "${curr.word}" 맞혔습니다!`,
                  time: getTimeStr()
                });
                Sound.chat();
                renderPlayHUDAndChat();
                setTimeout(() => triggerVictory(curr.id, false), 650);
              } else {
                recordWrongGuess(guessText, curr.id);
              }
            }, 1100);
          }
          return;
        }

        const timeStr = getTimeStr();
        const currentRoleTag = state.turnPhase; // 'ask' or 'answer'
        state.chatMessages.push({
          id: Date.now() + Math.random(),
          senderIdx: myIdx,
          type: 'chat',
          roleTag: currentRoleTag,
          text: raw,
          time: timeStr
        });
        state.chatDraft = '';
        state.chatMode = 'chat';
        Sound.chat();

        if (/^(예|응|맞아|네|ㅇㅇ|⭕)/.test(raw)) ThreeStage.triggerReaction('nod');
        else if (/^(아니|아냐|노|ㄴㄴ|땡|❌)/.test(raw)) ThreeStage.triggerReaction('shake');
        else if (raw.includes('?') || raw.includes('애매')) ThreeStage.triggerReaction('tilt');

        // Advance strict 1v1 turn state machine
        if (currentRoleTag === 'ask') {
          // Question sent -> Opponent's turn to ANSWER
          state.turnPhase = 'answer';
        } else {
          // Answer sent -> Roles swap! Responder now ASKS next question
          state.askerIdx = 1 - state.askerIdx;
          state.turnPhase = 'ask';
          state.turnCount += 1;
        }

        if (isOnline) {
          Net.send({
            type: 'chat',
            senderIdx: myIdx,
            roleTag: currentRoleTag,
            text: raw,
            time: timeStr,
            nextAskerIdx: state.askerIdx,
            nextTurnPhase: state.turnPhase,
            turnCount: state.turnCount
          });
          startTurnTimer();
          renderPlayHUDAndChat();
          const inputEl = document.getElementById('chat-input');
          if (inputEl) {
            inputEl.value = '';
            if (isMyTurnToAct()) inputEl.focus();
          }
          if (currentRoleTag === 'answer') {
            showToast('대답 완료! 이제 내 질문 차례예요 🎤', 'success');
          }
          return;
        }

        // Local AI Solo Mode:
        startTurnTimer();
        renderPlayHUDAndChat();
        const inputEl = document.getElementById('chat-input');
        if (inputEl) { inputEl.value = ''; }
        if (currentRoleTag === 'ask') {
          // User asked -> trigger AI to answer and then ask its own question
          AI.scheduleTurn(raw);
        } else {
          // User answered AI -> now it's User's turn to ask!
          if (inputEl) inputEl.focus();
          showToast('대답 완료! 이제 내 질문 차례예요 🎤', 'success');
        }
      }

      function recordWrongGuess(guess, guesserIdx = state.askerIdx) {
        const curr = state.players[guesserIdx];
        curr.wrongGuesses.push(guess);
        state.chatMessages.push({
          id: Date.now(),
          senderIdx: curr.id,
          type: 'guess_wrong',
          text: `🎯 정답 도전: "${guess}" → 오답!`,
          time: getTimeStr()
        });
        // Wrong guess passes question turn to the opponent
        state.askerIdx = 1 - guesserIdx;
        state.turnPhase = 'ask';
        state.turnCount += 1;
        state.chatMode = 'chat';
        Sound.wrong();
        showToast(`땡! "${guess}"은(는) 오답! ${state.players[state.askerIdx].name}님의 질문 차례!`, 'error');
        if (state.playMode === 'online') {
          Net.send({ type: 'guess_wrong', guesserIdx: curr.id, guess, nextAskerIdx: state.askerIdx });
          startTurnTimer();
          renderPlayHUDAndChat();
        } else {
          // Wrong guess -> AI asks a question
          renderPlayHUDAndChat();
          setTimeout(() => {
            if (state.screen !== 'play' || state.playMode !== 'local') return;
            const nextQ = AI.pickNextQuestion(state.selectedCategory);
            const qStr = typeof nextQ === 'object' ? `혹시 ${nextQ.word}인가요?` : nextQ;
            state.chatMessages.push({
              id: Date.now() + Math.random(),
              senderIdx: 1,
              type: 'chat',
              roleTag: 'ask',
              text: qStr,
              time: getTimeStr()
            });
            Sound.chat();
            ThreeStage.triggerReaction('tilt');
            state.askerIdx = 1;
            state.turnPhase = 'answer';
            startTurnTimer();
            renderPlayHUDAndChat();
            showSpeechBubble(state.players[1].name, qStr, 'ask');
          }, 800);
        }
      }

      function openJoinModal() {
        modalRoot.classList.remove('hidden');
        modalRoot.classList.remove('modal-backdrop-anim');
        void modalRoot.offsetWidth;
        modalRoot.classList.add('modal-backdrop-anim');

        modalRoot.innerHTML = `
          <div class="modal-luxury-card relative w-full max-w-md rounded-[28px] p-6 sm:p-7 bg-white/92 border border-white shadow-[0_32px_80px_-20px_rgba(35,25,36,0.45)] backdrop-blur-2xl text-[#231924]">

              <button id="join-modal-close" type="button" class="w-9 h-9 rounded-full bg-[#FFE5E6]/70 hover:bg-[#FFE5E6] text-[#6E494E] font-bold flex items-center justify-center transition" aria-label="닫기">✕</button>

            <div class="text-center mb-5">
              <div class="text-[10px] font-bold tracking-[0.22em] uppercase text-[#B83B5E] mb-1">JOIN PRIVATE ROOM</div>
              <h2 class="text-2xl font-black tracking-tight text-[#231924]">게임 참여하기</h2>
              <p class="text-xs sm:text-sm text-[#7A585D] mt-1 font-medium">사용할 닉네임과 친구에게 받은 방 코드를 입력하세요.</p>
            </div>

            <div class="space-y-4">
              <div class="luxury-stagger-1">
                <label for="popup-join-name" class="block text-xs font-bold text-[#7A585D] mb-1.5">내 닉네임</label>
                <input id="popup-join-name" type="text" maxlength="12" value="${escapeHtml(state.players[0].name)}" placeholder="닉네임을 입력하세요" class="steam-input w-full px-4 py-3 rounded-2xl font-bold text-sm" />
              </div>

              <div class="luxury-stagger-2">
                <label for="popup-join-code" class="block text-xs font-bold text-[#7A585D] mb-1.5">4자리 방 코드</label>
                <input id="popup-join-code" type="text" maxlength="6" value="${escapeHtml(state.online.joinCodeInput)}" placeholder="7K4P" class="steam-input w-full px-4 py-3.5 rounded-2xl font-black text-2xl tracking-[0.35em] text-center uppercase font-mono placeholder:text-[#C9A8AC]" />
              </div>

              <button id="popup-join-submit" type="button" class="luxury-stagger-2 w-full py-4 rounded-2xl font-bold text-base steam-btn-cyan flex items-center justify-center gap-2 mt-2">
                <span>방 참여하기</span>
                <span class="opacity-80">→</span>
              </button>
            </div>
          </div>
        `;

        const nameInp = document.getElementById('popup-join-name');
        const codeInp = document.getElementById('popup-join-code');
        if (state.online.joinCodeInput) nameInp.focus();
        else codeInp.focus();

        const doJoin = () => {
          const nick = nameInp.value.trim() || '친구';
          const code = codeInp.value.trim().toUpperCase();
          if (code.length < 4) {
            showToast('4자리 방 코드를 입력해주세요!', 'warn');
            codeInp.focus();
            return;
          }
          Sound.click();
          state.playMode = 'online';
          state.players[0].name = nick;
          state.players[1].name = nick;
          state.online.joinCodeInput = code;
          closeModal();
          Net.joinRoom(code);
        };

        document.getElementById('join-modal-back').addEventListener('click', openStartMenuModal);
        document.getElementById('join-modal-close').addEventListener('click', closeModal);
        document.getElementById('popup-join-submit').addEventListener('click', doJoin);
        codeInp.addEventListener('input', (e) => { state.online.joinCodeInput = e.target.value.toUpperCase(); });
        codeInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); });
        nameInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') codeInp.focus(); });
      }

      // --- SCREEN 1: SETUP (ONLINE 1:1 + LOCAL) ---
      function renderSetup() {

        document.body.style.backgroundImage = 'radial-gradient(circle at 50% 30%, #fff6f7 0%, #ffe5e6 58%, #f9d4d8 100%)';
        const catEntries = Object.values(CATEGORIES);
        const isOnline = state.playMode === 'online';

        const selectedCatObj = getCurrentCategoryInfo();
        appRoot.innerHTML = `

                    </p>
                  </div>

                  <!-- Sleek Floating Segmented Switcher -->
                  <div class="inline-grid grid-cols-2 p-1 rounded-full bg-white/60 border border-white/90 shadow-inner shrink-0 self-start sm:self-center">
                    <button id="btn-mode-online" type="button" class="px-4 py-2 rounded-full font-bold text-xs sm:text-sm transition-all ${isOnline ? 'bg-[#231924] text-white shadow-md' : 'text-[#7A585D] hover:text-[#231924]'}">
                      🌐 온라인 1:1

                    <button id="btn-mode-local" type="button" class="px-4 py-2 rounded-full font-bold text-xs sm:text-sm transition-all ${!isOnline ? 'bg-[#231924] text-white shadow-md' : 'text-[#7A585D] hover:text-[#231924]'}">

                <div class="lg:col-span-7 space-y-6">
                  ${isOnline ? `
                    <section class="steam-panel p-6">
                      <div class="flex items-center justify-between mb-4">

                          <div class="text-[10px] font-bold tracking-[0.18em] uppercase text-[#A46B72]">PLAYER PROFILE</div>

      // --- SCREEN 3: 3D 1ST-PERSON + CHAT-ONLY PLAY ---
      function renderPlayHUDAndChat() {
        ThreeStage.updateChalkboard();
        const isOnline = state.playMode === 'online';
        const myIdx = isOnline ? state.online.myIdx : 0;
        const curr = state.players[myIdx];
        const opp = state.players[1 - myIdx];
        const cat = getCurrentCategoryInfo();

        const hudEl = document.getElementById('play-hud');
        if (hudEl) {
          hudEl.innerHTML = `
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="px-2.5 py-1 rounded-xl bg-white/95 border-2 border-[#1E1B2E] text-xs font-black shadow-[2px_2px_0px_#1E1B2E]">
                ${cat.emoji} ${escapeHtml(cat.name)}
              </span>
              <span class="px-2.5 py-1 rounded-xl border-2 border-[#1E1B2E] text-xs font-black shadow-[2px_2px_0px_#1E1B2E] ${curr.id === 0 ? 'bg-[#FFE4E7] text-[#1E1B2E]' : 'bg-[#DFF7F5] text-[#1E1B2E]'}">
                👁️ 나: ${curr.avatar} ${escapeHtml(curr.name)}
              </span>
              <span class="px-2.5 py-1 rounded-xl border-2 border-[#1E1B2E] text-xs font-black shadow-[2px_2px_0px_#1E1B2E] ${isMyTurnToAct() ? 'bg-[#FFB703] text-[#1E1B2E]' : 'bg-slate-200 text-slate-700'}">
                ${state.turnPhase === 'ask' ? '🎤' : '💬'} ${escapeHtml(state.players[getActiveActorIdx()].name)}님의 ${state.turnPhase === 'ask' ? '질문' : '대답'} 차례
              </span>
              ${isOnline ? `
                <span class="px-2.5 py-1 rounded-xl border-2 border-[#1E1B2E] text-xs font-black shadow-[2px_2px_0px_#1E1B2E] ${state.online.peerConnected ? 'bg-emerald-200' : 'bg-rose-200'}">
                  ${state.online.peerConnected ? `🟢 온라인 (${escapeHtml(state.online.roomCode)})` : '🔴 연결 끊김'}
                </span>
              ` : ''}
              ${state.timerSetting > 0 ? `
                <button id="btn-pause-timer" type="button" class="px-2.5 py-1 rounded-xl bg-white/95 border-2 border-[#1E1B2E] text-xs font-black shadow-[2px_2px_0px_#1E1B2E] flex items-center gap-1">
                  <span>${state.timerPaused ? '▶️' : '⏱️'}</span>
                  <span id="live-timer-val">${state.timerRemaining}초</span>
                </button>
              ` : ''}
            </div>

            <div class="flex items-center gap-1.5">
              <div class="px-2.5 py-1 rounded-xl bg-white/95 border-2 border-[#1E1B2E] text-xs font-black shadow-[2px_2px_0px_#1E1B2E] flex items-center gap-1.5">
                <span>${state.players[0].avatar} ${state.players[0].score}</span>
                <span class="text-slate-400">:</span>
                <span>${state.players[1].score} ${state.players[1].avatar}</span>
              </div>

            </div>
          `;

          const pauseBtn = document.getElementById('btn-pause-timer');
          if (pauseBtn) {
            pauseBtn.addEventListener('click', () => {
              Sound.click();
              state.timerPaused = !state.timerPaused;
              renderPlayHUDAndChat();
            });
          }

        }

        const actorIdx = getActiveActorIdx();
        const actor = state.players[actorIdx];
        const canAct = isMyTurnToAct();
        const isAskPhase = state.turnPhase === 'ask';

        const bannerEl = document.getElementById('turn-banner');
        if (bannerEl) {
          if (state.online.waitingJudge) {
            bannerEl.className = 'px-3.5 py-2 border-b-2 border-[#1E1B2E] text-xs sm:text-sm font-black flex items-center justify-between bg-amber-100 text-[#1E1B2E]';
            bannerEl.innerHTML = `<span>🧐 ${escapeHtml(opp.name)}님이 정답인지 확인하고 있습니다...</span><span class="text-[11px] opacity-75">턴 ${state.turnCount}</span>`;
          } else if (canAct && isAskPhase) {
            bannerEl.className = 'px-3.5 py-2 border-b-2 border-[#1E1B2E] text-xs sm:text-sm font-black flex items-center justify-between bg-[#FFF3B0] text-[#1E1B2E]';
            bannerEl.innerHTML = `<span>🎤 ${escapeHtml(curr.name)}님의 질문 차례! 질문하거나 🎯 정답에 도전하세요</span><span class="text-[11px] opacity-75">턴 ${state.turnCount}</span>`;
          } else if (canAct && !isAskPhase) {
            bannerEl.className = 'px-3.5 py-2 border-b-2 border-[#1E1B2E] text-xs sm:text-sm font-black flex items-center justify-between bg-emerald-200 text-[#1E1B2E]';
            bannerEl.innerHTML = `<span>💬 ${escapeHtml(opp.name)}님이 질문했어요! ${escapeHtml(curr.name)}님, 대답해 주세요</span><span class="text-[11px] opacity-75">턴 ${state.turnCount}</span>`;
          } else if (isAskPhase) {
            bannerEl.className = 'px-3.5 py-2 border-b-2 border-[#1E1B2E] text-xs sm:text-sm font-black flex items-center justify-between bg-slate-200 text-slate-800';
            bannerEl.innerHTML = `<span>⏳ ${escapeHtml(actor.name)}님의 질문 차례입니다 (질문이 오면 대답하세요)</span><span class="text-[11px] opacity-75">턴 ${state.turnCount}</span>`;
          } else {
            bannerEl.className = 'px-3.5 py-2 border-b-2 border-[#1E1B2E] text-xs sm:text-sm font-black flex items-center justify-between bg-slate-200 text-slate-800';
            bannerEl.innerHTML = `<span>⏳ ${escapeHtml(actor.name)}님의 대답 차례입니다</span><span class="text-[11px] opacity-75">턴 ${state.turnCount}</span>`;
          }
        }

        const chatLogEl = document.getElementById('chat-log-list');
        if (chatLogEl) {
          let turnNoticeHtml = '';
          if (state.online.waitingJudge) {
            turnNoticeHtml = `
              <div class="flex justify-center pt-1">
                <div class="px-3.5 py-2 rounded-2xl bg-amber-100 border border-amber-400 text-[#1E1B2E] text-xs font-black text-center shadow-sm">
                  🧐 ${escapeHtml(opp.name)}님이 정답인지 확인하고 있습니다...
                </div>
              </div>
            `;
          } else if (!canAct && isAskPhase) {
            const typingLabel = state.playMode === 'local'
              ? `💬 <strong>${escapeHtml(actor.name)}님이 질문을 입력하고 있어요...</strong>`
              : `📢 지금은 <strong>${escapeHtml(actor.name)}님의 질문 차례</strong>입니다. 상대방이 질문하면 대답해 주세요!`;
            turnNoticeHtml = `
              <div class="flex justify-center pt-1">
                <div class="px-3.5 py-2 rounded-2xl bg-slate-200/90 border border-[#1E1B2E]/20 text-[#1E1B2E] text-xs font-black text-center shadow-sm">
                  ${typingLabel}
                </div>
              </div>
            `;
          } else if (!canAct && !isAskPhase) {
            const typingLabel = state.playMode === 'local'
              ? `💬 <strong>${escapeHtml(actor.name)}님이 채팅으로 대답을 입력하고 있어요...</strong>`
              : `📢 지금은 <strong>${escapeHtml(actor.name)}님의 대답 차례</strong>입니다. 답변을 기다리는 중이에요.`;
            turnNoticeHtml = `
              <div class="flex justify-center pt-1">
                <div class="px-3.5 py-2 rounded-2xl bg-slate-200/90 border border-[#1E1B2E]/20 text-[#1E1B2E] text-xs font-black text-center shadow-sm">
                  ${typingLabel}
                </div>
              </div>
            `;
          } else if (canAct && !isAskPhase) {
            turnNoticeHtml = `
              <div class="flex justify-center pt-1">
                <div class="px-3.5 py-2 rounded-2xl bg-emerald-100 border border-emerald-500 text-emerald-950 text-xs font-black text-center shadow-sm">
                  💬 ${escapeHtml(opp.name)}님이 질문을 보냈어요! 아래 입력창이나 빠른 대답으로 <strong>대답해 주세요</strong>.
                </div>
              </div>
            `;
          } else {
            turnNoticeHtml = `
              <div class="flex justify-center pt-1">
                <div class="px-3.5 py-2 rounded-2xl bg-[#FFF3B0] border border-amber-400 text-[#1E1B2E] text-xs font-black text-center shadow-sm">
                  🎤 <strong>${escapeHtml(curr.name)}님의 질문 차례</strong>입니다! 궁금한 점을 질문하거나 🎯 정답에 도전해 보세요.
                </div>
              </div>
            `;
          }

          chatLogEl.innerHTML = state.chatMessages.map(m => {
            if (m.type === 'system') {
              return `
                <div class="flex justify-center">
                  <span class="px-3 py-1 rounded-full bg-[#1E1B2E]/75 text-white text-[11px] font-bold text-center">
                    ${escapeHtml(m.text)}
                  </span>
                </div>
              `;
            }
            const sender = state.players[m.senderIdx];
            const isMine = m.senderIdx === myIdx;
            const roleBadge = m.type === 'chat'
              ? (m.roleTag === 'answer'
                ? '<span class="inline-block px-1.5 py-0.2 rounded bg-emerald-500 text-white text-[9px] font-black mr-1">대답</span>'
                : '<span class="inline-block px-1.5 py-0.2 rounded bg-amber-400 text-[#1E1B2E] text-[9px] font-black mr-1">질문</span>')
              : '';
            const bubbleColor = m.type === 'guess_wrong'
              ? 'bg-rose-100 border-rose-500 text-rose-900'
              : (sender.id === 0 ? 'bg-[#FFE4E7] border-[#1E1B2E]' : 'bg-[#DFF7F5] border-[#1E1B2E]');
            return `
              <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[82%] sm:max-w-[72%]">
                  <div class="text-[10px] font-black text-slate-600 mb-0.5 ${isMine ? 'text-right' : 'text-left'}">
                    ${roleBadge}${sender.avatar} ${escapeHtml(sender.name)} · ${m.time}
                  </div>
                  <div class="px-3.5 py-2 rounded-2xl border-2 text-sm font-bold shadow-[2px_2px_0px_#1E1B2E] break-words ${bubbleColor}">
                    ${escapeHtml(m.text)}
                  </div>
                </div>
              </div>
            `;
          }).join('') + turnNoticeHtml;
          chatLogEl.scrollTop = chatLogEl.scrollHeight;
        }

        const chipsBar = document.getElementById('quick-chips-bar');
        if (chipsBar) {
          const chips = isAskPhase ? getFreshAskChips(myIdx, false) : QUICK_ANSWER_CHIPS;
          const refreshBtnHtml = isAskPhase ? `
            <button type="button" id="btn-refresh-chips" ${canAct ? '' : 'disabled'} class="shrink-0 px-2.5 py-1 rounded-lg border border-amber-400 bg-amber-50 hover:bg-amber-200 text-[#1E1B2E] text-xs font-black transition ${canAct ? '' : 'opacity-40 cursor-not-allowed'}" title="새로운 추천 질문 보기">
              🔄 다른 추천
            </button>
          ` : '';
          chipsBar.innerHTML = refreshBtnHtml + chips.map(c => `
            <button type="button" data-quick-chat="${escapeHtml(c.text)}" ${canAct ? '' : 'disabled'} class="shrink-0 px-2.5 py-1 rounded-lg border border-[#1E1B2E]/25 text-xs font-bold transition ${canAct ? (isAskPhase ? 'bg-slate-100 hover:bg-amber-100' : 'bg-emerald-50 hover:bg-emerald-200') : 'bg-slate-100 opacity-40 cursor-not-allowed'}">
              ${c.label}
            </button>
          `).join('');
          const refBtn = document.getElementById('btn-refresh-chips');
          if (refBtn) {
            refBtn.addEventListener('click', () => {
              if (!isMyTurnToAct()) return;
              Sound.click();
              getFreshAskChips(myIdx, true);
              renderPlayHUDAndChat();
            });
          }
          chipsBar.querySelectorAll('[data-quick-chat]').forEach(btn => {
            btn.addEventListener('click', () => {
              if (!isMyTurnToAct()) return;
              state.chatMode = 'chat';
              state.chatDraft = btn.dataset.quickChat;
              handleChatSubmit();
            });
          });
        }

        const modeChatBtn = document.getElementById('btn-mode-chat');
        const modeGuessBtn = document.getElementById('btn-mode-guess');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('btn-chat-send');
        if (modeChatBtn && modeGuessBtn && chatInput && sendBtn) {
          if (!isAskPhase && state.chatMode === 'guess') state.chatMode = 'chat';
          const isGuess = isAskPhase && state.chatMode === 'guess';
          modeChatBtn.textContent = isAskPhase ? '🎤 질문' : '💬 대답';
          modeChatBtn.disabled = !canAct;
          modeGuessBtn.disabled = !canAct || !isAskPhase;
          modeChatBtn.className = `px-2.5 py-1.5 rounded-lg text-xs font-black transition ${!isGuess ? 'bg-[#1E1B2E] text-white' : 'text-slate-600 hover:bg-slate-200'} ${!canAct ? 'opacity-50' : ''}`;
          modeGuessBtn.className = `px-2.5 py-1.5 rounded-lg text-xs font-black transition ${isGuess ? 'bg-[#FF5E6C] text-white' : 'text-slate-600 hover:bg-slate-200'} ${(!canAct || !isAskPhase) ? 'opacity-40 cursor-not-allowed' : ''}`;
          chatInput.disabled = !canAct;
          sendBtn.disabled = !canAct;
          chatInput.placeholder = !canAct
            ? (isAskPhase
              ? `${actor.name}님의 질문 차례입니다. 질문이 오면 대답해 주세요!`
              : `${actor.name}님의 대답 차례입니다...`)
            : isGuess
              ? `${curr.name}님의 이마 위 정답을 입력하세요!`
              : isAskPhase
                ? `내 질문 차례! ${opp.name}님에게 질문할 내용을 입력하세요...`
                : `${opp.name}님이 질문했어요! 여기에 대답을 입력하세요...`;
          sendBtn.textContent = isGuess ? '정답 외치기!' : (isAskPhase ? '질문 전송' : '대답 전송');
          sendBtn.className = `px-4 py-2.5 rounded-xl font-black text-sm btn-pop shrink-0 ${isGuess ? 'bg-[#FF5E6C] text-white' : (isAskPhase ? 'bg-[#FFB703] text-[#1E1B2E]' : 'bg-emerald-400 text-[#1E1B2E]')}`;
        }
      }

                  <button id="btn-chat-send" type="button" class="px-4 py-2 rounded-xl bg-[#FFB703] font-black text-sm btn-pop shrink-0">전송</button>
                </div>
              </div>
            </div>
          </div>
        `;

        const stageEl = document.getElementById('three-stage');
        ThreeStage.mount(stageEl);
        renderPlayHUDAndChat();

        const chatInput = document.getElementById('chat-input');
        chatInput.addEventListener('input', (e) => {
          state.chatDraft = e.target.value;
        });
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.isComposing) {
            e.preventDefault();
            handleChatSubmit();
          }
        });

        document.getElementById('btn-chat-send').addEventListener('click', handleChatSubmit);

        document.getElementById('btn-mode-chat').addEventListener('click', () => {
          Sound.click();
          state.chatMode = 'chat';
          renderPlayHUDAndChat();

          state.chatMode = 'guess';
          renderPlayHUDAndChat();
          chatInput.focus();
        });

        // Quick chips are bound dynamically inside renderPlayHUDAndChat()
      }

                  <button id="btn-change-topic" type="button" class="py-4 rounded-2xl bg-white hover:bg-slate-100 font-black text-base sm:text-lg btn-pop">
                    🗂️ 다른 주제 고르기
                  </button>
                </div>
              `}
            </section>
          </div>
        `;

        const nextBtn = document.getElementById('btn-next-round');
        if (nextBtn) {
          nextBtn.addEventListener('click', () => startNewRound(true));
        }
        document.getElementById('btn-change-topic').addEventListener('click', () => {
          Sound.click();
          clearTurnTimer();
          Net.cleanup();
          state.screen = 'setup';
          render();
        });
      }

      // ==========================================
      // 9. MASTER RENDER & GLOBAL LISTENERS
      // ==========================================
      function render() {
        if (state.screen === 'title') renderTitle();
        else if (state.screen === 'setup') renderSetup();
        else if (state.screen === 'lobby') renderLobby();
        else if (state.screen === 'word_setup') renderWordSetup();
        else if (state.screen === 'handoff') renderHandoff();
        else if (state.screen === 'play') renderPlay();
        else if (state.screen === 'result') renderResult();
      }

      document.getElementById('btn-rules').addEventListener('click', openRulesModal);

      btnMute.addEventListener('click', () => {
        Sound.muted = !Sound.muted;
        btnMute.textContent = Sound.muted ? '🔇' : '🔊';
        if (Sound.muted) {
          BGM.stop(false);
        } else {
          Sound.click();
          BGM.start();
        }
        showToast(Sound.muted ? '소리를 껐어요.' : '소리를 켰어요!', 'dark');
      });

      // Start gentle BGM automatically on first user gesture anywhere
      const unlockAudio = () => {
        if (!Sound.muted && !BGM.userPaused) BGM.start();
        window.removeEventListener('pointerdown', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
      };
      window.addEventListener('pointerdown', unlockAudio);
      window.addEventListener('keydown', unlockAudio);

      document.getElementById('btn-logo-home').addEventListener('click', () => {
        if (state.screen === 'setup') return;
        Sound.click();
        modalRoot.innerHTML = `
          <div class="card-pop max-w-sm w-full p-6 bg-white text-center">
            <div class="text-3xl mb-2">🏠</div>
            <h2 class="text-lg font-black mb-1">처음 화면으로 돌아갈까요?</h2>
            <p class="text-sm text-slate-600 mb-5">현재 진행 중인 방/라운드가 종료되고 설정 화면으로 이동합니다.</p>
            <div class="grid grid-cols-2 gap-3">
              <button id="home-cancel" type="button" class="py-2.5 rounded-xl bg-slate-100 font-bold btn-pop">계속하기</button>
              <button id="home-confirm" type="button" class="py-2.5 rounded-xl bg-[#FF5E6C] text-white font-black btn-pop">처음으로</button>
            </div>
          </div>
        `;
        modalRoot.classList.remove('hidden');
        document.getElementById('home-cancel').addEventListener('click', closeModal);
        document.getElementById('home-confirm').addEventListener('click', () => {
          closeModal();
          clearTurnTimer();
          AI.clear(); ThreeStage.dispose();
          Net.cleanup();
          state.screen = 'setup';
          render();
        });
      });

      modalRoot.addEventListener('click', (e) => {
        if (e.target === modalRoot) closeModal();
      });

      window.addEventListener('load', () => {
        render();
      });
      render();
    })();
  </script>
</body>
</html>
